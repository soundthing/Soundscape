# Caption vocabulary. OWNER: Person 1.
#
# Each class:
#   id       stable snake_case id. Used in priors.yaml, thresholds.yaml, eval labels.
#   caption  text shown on screen, without brackets.
#   audioset AudioSet ontology display names whose tagger scores map to this class
#            (class score = max over listed labels). Must match the tagger's label
#            CSV exactly; `soundthing check-config --audioset <csv>` verifies this.
#   clap     zero-shot CLAP prompts, used for classes AudioSet covers poorly or
#            as a second opinion. A class needs at least one of audioset/clap.
#   coarse   optional coarse group id; used when the detector is unsure between
#            confusable fine classes (e.g. door_slam vs gunshot -> impact).
#   safety   true = safety-critical: bypasses environment conditioning.
#   sustained true = background/continuous sound; captioned once, not repeatedly.
#
# parents  optional direct ancestors; unknown ids and cycles are rejected.
#
# Full 527-class PANNs vocabulary plus the five existing CLAP-only classes.
# Existing class ids keep their primary AudioSet label; former aliases have their
# own output class so a parent score cannot falsely trigger its specific child.
# Hierarchy derived from Google's AudioSet ontology, CC BY-SA 4.0:
# https://github.com/audioset/ontology (downloaded 2026-10-17).
# Reproduce with soundthing.events.vocabulary; see docs/sound-hierarchy.md.

coarse_groups:
  impact: { caption: loud impact }
  alarm: { caption: alarm }
  vehicle: { caption: vehicle }
  animal: { caption: animal sounds }
  crowd_noise: { caption: crowd noise }
  water: { caption: water running }
  beeping: { caption: beeping }

classes:
  # --- safety set (always active) ---------------------------------------------
  - {id: siren, caption: siren wailing, audioset: [Siren], coarse: alarm, safety: true, parents: [alarm_ringing]}
  - {id: smoke_alarm, caption: smoke alarm beeping, audioset: ['Smoke detector, smoke alarm'], coarse: alarm, safety: true, parents: [alarm_ringing]}
  - {id: alarm_ringing, caption: alarm ringing, audioset: [Alarm], coarse: alarm, safety: true, parents: []}
  - {id: car_alarm, caption: car alarm, audioset: [Car alarm], coarse: alarm, safety: true, parents: [alarm_ringing, audioset_m_0k4j]}
