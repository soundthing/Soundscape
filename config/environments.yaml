# Environment list. OWNER: Person 2.
#
# Adding an environment = add an entry here + a block in priors.yaml. No code changes.
# `general` is the low-confidence fallback and must always exist; it is never
# predicted directly by the zero-shot classifier (no prompts).
#
# visual_prompts -> CLIP/SigLIP text prompts, scored against sampled frames
# audio_prompts  -> CLAP text prompts, scored against segment audio
# Multiple prompts per env are averaged (prompt ensembling).

environments:
  - id: general
    display: General / unknown
    visual_prompts: []
    audio_prompts: []

  - id: street
    display: Street / outdoors urban
    visual_prompts:
      - a photo of a busy city street
      - a photo of a sidewalk with cars and buildings
      - a photo of an intersection with traffic
    audio_prompts:
      - the sound of traffic on a busy street
      - city street ambience with cars passing

  - id: kitchen
    display: Kitchen
    visual_prompts:
      - a photo of a kitchen
      - a photo of someone cooking at a stove
      - a photo inside a commercial restaurant kitchen with stainless steel equipment and food prep stations
      - a photo of cooks preparing food on a grill and fryer in a fast food kitchen
    audio_prompts:
      - the sound of cooking in a kitchen
      - dishes clinking and food sizzling in a kitchen
      - the sound of a busy commercial kitchen with a sizzling grill and fryer
      - food preparation and kitchen equipment operating behind a restaurant counter

  - id: office
    display: Office / indoor workplace
    visual_prompts:
      - a photo of an office with desks and computers
      - a photo of a meeting room
    audio_prompts:
      - the quiet ambience of an office with keyboard typing
      - indoor office room tone

  - id: nature
    display: Nature / outdoors rural
    visual_prompts:
      - a photo of a forest
      - a photo of a field, river, or mountains
      - a photo of a beach
    audio_prompts:
      - birds singing in a forest
      - wind and water sounds in nature

  - id: sports_venue
    display: Sports venue
    visual_prompts:
      - a photo of a sports stadium
      - a photo of a basketball court or soccer field with players
    audio_prompts:
      - a cheering crowd at a sports game
      - the sound of a referee whistle and crowd in a stadium

  - id: vehicle_interior
    display: Inside a private vehicle
    visual_prompts:
      - a photo taken inside a car
      - a photo of a driver and dashboard inside a private car
    audio_prompts:
      - engine hum heard from inside a car
      - the sound inside a moving private car

  - id: lecture_hall
    display: School lecture hall
    visual_prompts:
      - a photo of a lecturer in a large lecture hall with tiered seats
      - a photo of students seated in a university lecture auditorium
    audio_prompts:
      - the sound of a lecturer speaking to a large audience in a lecture hall
      - students listening and applauding in a school lecture hall

  - id: restaurant
    display: Restaurant
    visual_prompts:
      - a photo of a restaurant dining room with tables and diners
      - a photo of customers eating at tables in a restaurant dining room
    audio_prompts:
      - restaurant dining ambience with plates and conversation
      - cutlery and conversation among diners in a restaurant dining room

  - id: cafe
    display: Cafe
    visual_prompts:
      - a photo of a coffee shop counter and tables
      - a photo of a barista serving coffee in a cafe
    audio_prompts:
      - coffee shop ambience with an espresso machine and conversation
      - cups clinking and people talking in a cafe

  - id: public_transportation
    display: Public transportation
    visual_prompts:
      - a photo inside a city bus with passengers
      - a photo inside a subway or passenger train car
    audio_prompts:
      - passengers and transit doors inside a bus or train
      - rumbling and announcements inside a subway train

  - id: factory
    display: Factory
    visual_prompts:
      - a photo of an industrial factory floor with machinery
      - a photo of workers on a manufacturing assembly line
    audio_prompts:
      - machinery running on a factory floor
      - industrial equipment humming and clanking in a factory

  - id: construction
    display: Construction site
    visual_prompts:
      - a photo of an active construction site with workers and cranes
      - a photo of a building site with excavators
    audio_prompts:
      - power tools and hammering at a construction site
      - heavy equipment operating on a building site

  - id: classroom
    display: School classroom
    visual_prompts:
      - a photo of a school classroom with desks and a teacher
      - a photo of students in a small classroom with a blackboard
    audio_prompts:
      - a teacher speaking to students in a classroom
      - students talking in a school classroom
