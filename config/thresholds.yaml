# Required scores on the conditioned output. OWNER: Person 1.
# Specificity is a tunable display policy, not measured model calibration.
# Safety: explicit override -> safety_default; tiers never change it.
# Other labels: max(tier, explicit override), or the legacy lookup if untiered.

default: 0.5
safety_default: 0.6

# Tune these four values to adjust whole groups. Thresholds stay in (0, 1).
tiers:
  generic: 0.35
  broad: 0.50
  specific: 0.65
  fine: 0.80

# Explicit overrides remain minimums; safety overrides remain exact.
classes:
  gunshot: 0.75
  explosion: 0.75
  scream: 0.7
  glass_break: 0.65
  door_slam: 0.55
  thud: 0.6
  crash: 0.6
  footsteps: 0.55

# All 527 PANNs labels are assigned explicitly, independent of graph depth.
# Broad: general categories/acoustics. Specific: named sources/actions.
# Fine: subtypes, exact calls, techniques, styles, context and attribution.
# Safety labels are listed for completeness but bypass their tier.
