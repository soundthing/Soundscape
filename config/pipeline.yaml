# Runtime settings for each stage. Sections are owned by the stage owner.
# `backend: stub` produces fake-but-valid output so the end-to-end path works
# before the real models exist. Switch to `real` as components land.

extract:            # Person 3
  sample_rate: 16000
  fps: 1.0
  keep_stereo: true

environment:        # Person 2
  backend: real     # stub | real
  segmentation:
    detector: content         # PySceneDetect detector
    threshold: 27.0
    min_segment_sec: 5.0
    max_segment_sec: 30.0     # split long shots so the env can drift
  visual:
    model: google/siglip-base-patch16-224
  audio:
    model: laion/clap-htsat-unfused
  fusion:
    audio_weight: 0.3
    visual_weight: 0.7
    temperature: 0.01         # softmax temperature over prompt similarities
    visual_similarity_floor: 0.0  # all visual prompt similarities below this -> general
  confidence_threshold: 0.45  # below this -> env = general

events:             # Person 1
  backend: real     # stub | real
  window_sec: 1.0
  hop_sec: 0.25
  tagger:
    model: panns_cnn14        # panns_cnn14 | beats | yamnet
  vad:
    model: silero
    # Speech labels must not be suppressed by the speech detector itself.
    exempt_classes: [audioset_m_09x0r, audioset_m_05zppz, audioset_m_02zsn, audioset_m_0ytgt, audioset_m_01h8n0, audioset_m_02qldy, audioset_m_0261r1, audioset_m_0brhx]
    suppress_under_speech: 0.3  # multiply non-safety scores by this inside speech regions
    threshold: 0.5
    min_speech_sec: 0.25
    pad_sec: 0.1
    merge_gap_sec: 0.3
  separation:
    enabled: false
    model: htdemucs             # demucs pretrained model name
    gate_labels:                # AudioSet labels that trigger separation of a window
      - "Speech"
      - "Male speech, man speaking"
      - "Female speech, woman speaking"
      - "Conversation"
      - "Narration, monologue"
      - "Music"
      - "Singing"
      - "Song"
    gate_threshold: 0.3         # window gated if max gate-label prob >= this
    gate_vad: true              # also gate VAD speech regions
    pad_sec: 0.5                # pad gated spans on both sides
    crossfade_sec: 0.05         # linear crossfade at span and chunk edges
    chunk_sec: 10.0             # longest piece passed to the separator at once
    fusion: max                 # max | sep | weighted   (masked windows only)
    sep_weight: 0.5             # weighted: sep_weight*sep + (1-sep_weight)*raw
    suppress_under_speech: 1.0  # VAD suppression factor for non-safety classes on masked windows
  postprocess:
    min_event_sec: 0.3
    merge_gap_sec: 0.5
    coarse_margin: 0.1          # top-2 within this margin and same coarse group -> coarse label
    onset_shift_sec: 0.0        # seconds added to every event's start/end; positive = later
  prior_estimation:
    alpha: 200.0
    min_class: 20
    min_environment: 50
    max_gain: 4.0
    uncertainty_pattern: \b(?:possibly|perhaps|might|could|such as|seems|likely|probably)\b
    environment_patterns:
      street:
      - \b(?:city street|busy street|street corner|sidewalk|intersection|urban street|roadside)\b
      kitchen:
      - \bkitchen\b
      office:
      - \b(?:office|workplace|meeting room|conference room)\b
      nature:
      - \b(?:forest|woodland|beach|riverbank|countryside|rural landscape|wilderness|nature reserve)\b
      sports_venue:
      - \b(?:stadium|sports arena|basketball court|tennis court|soccer field|football field|baseball field|sports venue)\b
      vehicle_interior:
      - \b(?:inside (?:a |the )?(?:car|truck|private vehicle)|car interior|truck interior|dashboard|driver.s seat)\b
      lecture_hall:
      - \b(?:lecture hall|lecture theatre|lecture theater|university auditorium)\b
      restaurant:
      - \b(?:restaurant|dining room)\b
      cafe:
      - \b(?:cafe|café|coffee shop|coffeehouse)\b
      public_transportation:
      - \b(?:inside (?:a |the )?(?:bus|train|subway|tram)|bus interior|train interior|subway car|passenger (?:train|bus)|metro
        station|subway station)\b
      factory:
      - \b(?:factory|industrial plant|manufacturing plant|manufacturing facility)\b
      construction:
      - \b(?:construction site|building site|construction zone)\b
      classroom:
      - \b(?:classroom|school room)\b
  modifiers:
    enabled: true
    side_balance: 0.35
    trend_db: 6.0
    min_trend_sec: 1.5
    loud_db: 12.0
    quiet_db: -12.0
    frame_sec: 0.1

captions:           # Person 3
  min_cue_sec: 1.0              # extend very short events so they are readable
  max_cue_sec: 6.0

eval:               # Person 3
  onset_tolerance_sec: 0.5
