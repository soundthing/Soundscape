<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>soundthing demo</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; background: #111; color: #eee; }
    .players { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    video { width: 100%; background: #000; }
    video::cue { font-size: 1.1rem; background: rgba(0,0,0,.8); }
    #status { margin: 1rem 0; color: #aaa; }
    #env { font-size: .9rem; color: #9cf; min-height: 1.2em; }
  </style>
</head>
<body>
  <h1>soundthing — non-speech captions</h1>
  <form id="upload">
    <input type="file" name="file" accept=".mp4,.mov,.webm" required>
    <button>Upload &amp; process</button>
  </form>
  <div id="status"></div>
  <div id="env"></div>
  <div class="players">
    <div><h3>Baseline (audio only)</h3><video id="baseline" controls muted crossorigin></video></div>
    <div><h3>Environment-conditioned</h3><video id="conditioned" controls crossorigin></video></div>
  </div>
<script>
const $ = (id) => document.getElementById(id);
let segments = [];

function load(videoId) {
  for (const mode of ["baseline", "conditioned"]) {
    const v = $(mode);
    v.innerHTML = "";
    v.src = `/api/videos/${videoId}/video`;
    const t = document.createElement("track");
    Object.assign(t, { kind: "captions", label: mode, srclang: "en", default: true,
                       src: `/api/videos/${videoId}/captions/${mode}.vtt` });
    v.appendChild(t);
    t.track.mode = "showing";
  }
  fetch(`/api/videos/${videoId}/env_segments`).then(r => r.ok ? r.json() : []).then(s => segments = s);
}

// Keep the two players in sync; the conditioned one is the leader.
const lead = $("conditioned"), follow = $("baseline");
lead.addEventListener("play", () => follow.play());
lead.addEventListener("pause", () => follow.pause());
lead.addEventListener("seeked", () => { follow.currentTime = lead.currentTime; });
lead.addEventListener("timeupdate", () => {
  if (Math.abs(follow.currentTime - lead.currentTime) > 0.3) follow.currentTime = lead.currentTime;
  const s = segments.find(s => s.start <= lead.currentTime && lead.currentTime < s.end);
  $("env").textContent = s ? `environment: ${s.env} (${Math.round(s.confidence * 100)}%)` : "";
});

$("upload").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("status").textContent = "uploading…";
  const res = await fetch("/api/videos", { method: "POST", body: new FormData(e.target) });
  if (!res.ok) { $("status").textContent = `upload failed: ${await res.text()}`; return; }
  const { video_id } = await res.json();
  const poll = async () => {
    const s = await (await fetch(`/api/videos/${video_id}`)).json();
    $("status").textContent = `${video_id}: ${s.status}${s.error ? " — " + s.error : ""}`;
    if (s.status === "done") load(video_id);
    else if (s.status !== "error") setTimeout(poll, 1000);
  };
  poll();
});

const q = new URLSearchParams(location.search).get("v");
if (q) load(q);
</script>
</body>
</html>
