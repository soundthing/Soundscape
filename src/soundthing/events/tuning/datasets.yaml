fsd50k:
  # FSD50K labels are hierarchy-propagated: never map a parent label (Alarm, Door,
  # Glass, ...) whose children map to other classes, or every child clip becomes
  # two-class and is dropped (or mislabeled).
  map:
    Accelerating_and_revving_and_vroom: engine_rev
    Aircraft: aircraft
    Applause: applause
    Bark: dog_bark
    Bird_vocalization_and_bird_call_and_bird_song: birdsong
    Blender: blender
    Boiling: boiling
    Car_passing_by: car_passing
    Cheering: cheering
    Chopping_(food): chopping
    Clapping: applause
    Clock: clock_ticking
    Computer_keyboard: typing
    Cough: cough
    Cricket: insects
    Crowd: crowd_murmur
    Cutlery_and_silverware: dishes
    Dishes_and_pots_and_pans: dishes
    Doorbell: doorbell
    Engine_starting: engine_start
    Explosion: explosion
    Fireworks: fireworks
    Fixed-wing_aircraft_and_airplane: aircraft
    Frying_(food): sizzling
    Gunshot_and_gunfire: gunshot
    Helicopter: helicopter
    Insect: insects
    Keys_jangling: keys_jingle
    Knock: door_knock
    Laughter: laughter
    Meow: cat_meow
    Microwave_oven: microwave_beep
    Motorcycle: motorcycle
    Ocean: waves
    Printer: printer
    Rain: rain
    Raindrop: rain
    Ringtone: phone_ring
    Screaming: scream
    Shatter: glass_break
    Sink_(filling_or_washing): faucet
    Siren: siren
