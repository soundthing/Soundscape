# Dataset-to-vocabulary mappings and synthetic mix recipes for tuning.
# All target class ids must exist in config/vocabulary.yaml.

esc50:
  map:
    airplane: aircraft
    car_horn: car_horn
    cat: cat_meow
    chirping_birds: birdsong
    clapping: applause
    clock_alarm: alarm_ringing
    clock_tick: clock_ticking
    coughing: cough
    crickets: insects
    crow: birdsong
    crying_baby: baby_cry
    dog: dog_bark
    door_wood_creaks: door_open_close
    door_wood_knock: door_knock
    fireworks: fireworks
    footsteps: footsteps
    glass_breaking: glass_break
    helicopter: helicopter
    insects: insects
    keyboard_typing: typing
    laughing: laughter
    mouse_click: mouse_click
    rain: rain
    sea_waves: waves
    siren: siren
    thunderstorm: thunder
    train: train
    wind: wind
  unmapped:
    - breathing
    - brushing_teeth
    - can_opening
    - chainsaw
    - church_bells
    - cow
    - crackling_fire
    - drinking_sipping
    - engine
    - frog
    - hand_saw
    - hen
    - pig
    - pouring_water
    - rooster
    - sheep
    - sneezing
    - snoring
    - toilet_flush
    - vacuum_cleaner
    - washing_machine
    - water_drops
  background:
    - breathing
    - crackling_fire
    - vacuum_cleaner
    - washing_machine
    - water_drops

fsd50k:
  map: {}                     # placeholder, filled by a later milestone

mix:
  sample_rate: 16000
  clip_sec: 30.0
  events_per_mix: [3, 6]      # inclusive range
  snr_db: [6.0, 20.0]         # event active-RMS over bed RMS
  bed_dbfs: -40.0             # bed RMS level
  min_gap_sec: 0.5            # silence between placed events (no overlaps)
  trim_frame_sec: 0.02
  trim_rel_db: -35.0          # energy gate relative to the clip's loudest frame
  trim_floor_dbfs: -60.0      # absolute gate floor
  max_event_sec: 8.0          # longer trimmed sources are cut to this
